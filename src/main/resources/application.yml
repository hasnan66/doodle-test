spring:
  application:
    name: doodle-test
  datasource:
    url: '${DB_URL:jdbc:h2:file:./data/doodle;DB_CLOSE_ON_EXIT=FALSE}'
    username: '${DB_USER:sa}'
    password: '${DB_PASSWORD:}'
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
